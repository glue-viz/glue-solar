[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "glue-solar"
description = "Solar Physics plugin for GlueViz"
requires-python = ">=3.13"
readme = { file = "README.rst", content-type = "text/x-rst" }
license-files = ["licenses/LICENSE.rst"]
authors = [
  { name = "The SunPy Community", email = "sunpy@googlegroups.com" },
]
dependencies = [
  # each at the latest release glue-solar is tested with, raised as new ones come out (D104)
  "asdf>=6.0.0",
  "astropy>=8.0.2",
  "dask[array]>=2026.8.0",
  "dkist>=1.18.1",  # DKIST datasets (D102), as irispy needs it
  "echo>=0.16.0",
  "glue-core>=1.28.0",  # its pytest plugin keeps the tests off ~/.glue (glue-viz/glue#2587)
  "glue-qt>=0.4.2",  # without its qt extra, which is PyQt5
  "gwcs>=1.0.3",
  "matplotlib>=3.11.2",
  "mpl-scatter-density>=0.8",
  "ndcube>=2.4.3",
  "numpy>=2.5.4",
  "pillow>=13.0.0",
  "PyQt6>=6.12.0",
  "qtpy>=2.4.3",
  "scipy>=1.18.1",
  "sunpy[map,net]>=8.0.1",
  # irispy main at a commit glue-solar is tested with, while irispy changes in a batch (D91); a PR moves it after
  "irispy-lmsal @ git+https://github.com/LM-SAL/irispy.git@f0587057b255015c820b4fb4239cfbec67b5e354",
]
dynamic = ["version"]
keywords = ["solar physics", "solar", "science", "sun", "visualization", "coordinates", "glueviz"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
density = [
  "fiasco>=0.8.2",  # as irispy's density_diagnostic needs
]
tests = [
  "pytest",
  "pytest-qt",
  "pytest-doctestplus",
  "pytest-cov",
  "pytest-xdist",
  "pytest-remotedata",
  "pooch",
  "filelock",
]
docs = [
  "sphinx",
  "sphinx-automodapi",
  "sphinx-changelog",
  "sunpy-sphinx-theme",
  "packaging",
]

[project.urls]
Homepage = "https://glueviz.org"
"Source Code" = "https://github.com/glue-viz/glue-solar"
Download = "https://pypi.org/project/glue-solar"
Documentation = "https://glue-solar.readthedocs.io/en/latest/"
Changelog = "https://glue-solar.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/glue-viz/glue-solar/issues/"

[project.entry-points."glue.plugins"]
glue_solar = "glue_solar:setup"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["glue_solar*"]

[tool.setuptools_scm]
version_file = "glue_solar/version.py"

[tool.gilesbot]
  [tool.gilesbot.pull_requests]
  enabled = true

  [tool.gilesbot.towncrier_changelog]
  enabled = true
  verify_pr_number = true
  changelog_skip_label = "No Changelog Entry Needed"
  help_url = "https://github.com/glue-viz/glue-solar/blob/main/changelog/README.rst"

  changelog_missing_long = "There isn't a changelog file in this pull request. Please add a changelog file to the `changelog/` directory following the instructions in the changelog [README](https://github.com/glue-viz/glue-solar/blob/main/changelog/README.rst)."

  type_incorrect_long = "The changelog file you added is not one of the allowed types. Please use one of the types described in the changelog [README](https://github.com/glue-viz/glue-solar/blob/main/changelog/README.rst)"

  number_incorrect_long = "The number in the changelog file you added does not match the number of this pull request. Please rename the file."

# TODO: This should be in towncrier.toml but Giles currently only works looks in
# pyproject.toml we should move this back when it's fixed.
[tool.towncrier]
  package = "glue_solar"
  filename = "CHANGELOG.rst"
  directory = "changelog/"
  issue_format = "`#{issue} <https://github.com/glue-viz/glue-solar/pull/{issue}>`__"
  title_format = "{version} ({project_date})"

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "removal"
  name = "Removals"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "New Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "bugfix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "doc"
  name = "Documentation"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "trivial"
  name = "Internal Changes"
  showcontent = true
